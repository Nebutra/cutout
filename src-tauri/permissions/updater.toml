[[permission]]
identifier = "updater-runtime"
description = "Allows the main desktop window to use Cutout's narrow, policy-checked updater runtime."
commands.allow = [
  "updater_status",
  "updater_check",
  "updater_download",
  "updater_cancel",
  "updater_install_and_relaunch",
]

[[permission]]
identifier = "workspace-revision-bridge"
description = "Allows conflict-checked Design IR exchange, bounded Agent event persistence, and controlled CodingTask staging for an authorized workspace."
commands.allow = [
  "coding_workspace_create_managed",
  "coding_workspace_seed_managed_assets",
  "workspace_revision_read",
  "workspace_revision_preview_export",
  "workspace_revision_apply_export",
  "workspace_run_events_read",
  "workspace_run_events_write",
  "coding_workspace_snapshot",
  "coding_workspace_read_allowed",
  "coding_workspace_preview",
  "coding_workspace_stage",
  "coding_workspace_run_checks",
  "coding_workspace_promote",
  "coding_workspace_rollback",
]
